syntax = "proto3";

package stockhold.v1;

option go_package = "stockhold/gen/stockhold/v1;stockholdv1";

import "google/protobuf/timestamp.proto";

service StockholdService {
  rpc CreateItem(CreateItemRequest) returns (Item);
  rpc GetItem(GetItemRequest) returns (Item);
  rpc Restock(RestockRequest) returns (RestockResponse);
  rpc Reserve(ReserveRequest) returns (ReserveResponse);
  rpc GetReservation(GetReservationRequest) returns (Reservation);
  rpc Confirm(ChangeReservationRequest) returns (Reservation);
  rpc Cancel(ChangeReservationRequest) returns (Reservation);
}

message Item {
  string sku = 1;
  string name = 2;
  int64 on_hand = 3;
  int64 available = 4;
  google.protobuf.Timestamp created_at = 5;
}

enum ReservationStatus {
  RESERVATION_STATUS_UNSPECIFIED = 0;
  RESERVATION_STATUS_PENDING = 1;
  RESERVATION_STATUS_CONFIRMED = 2;
  RESERVATION_STATUS_CANCELLED = 3;
  RESERVATION_STATUS_EXPIRED = 4;
}

message Reservation {
  string id = 1;
  string sku = 2;
  int64 quantity = 3;
  ReservationStatus status = 4;
  google.protobuf.Timestamp expires_at = 5;
  google.protobuf.Timestamp created_at = 6;
  google.protobuf.Timestamp updated_at = 7;
}

message CreateItemRequest {
  string sku = 1;
  string name = 2;
  int64 quantity = 3;
}

message GetItemRequest { string sku = 1; }

message RestockRequest {
  string sku = 1;
  int64 quantity = 2;
  string idempotency_key = 3;
}

message RestockResponse {
  Item item = 1;
  bool replayed = 2;
}

message ReserveRequest {
  string sku = 1;
  int64 quantity = 2;
  int64 ttl_seconds = 3;
  string idempotency_key = 4;
}

message ReserveResponse {
  Reservation reservation = 1;
  bool replayed = 2;
}

message GetReservationRequest { string id = 1; }
message ChangeReservationRequest { string id = 1; }
